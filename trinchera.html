<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Configura tu Trinchera de laOra: acabado, brazalete o correa y precio, en una sola pantalla. Desde 169,90 €.">
<meta name="theme-color" content="#151715">
<title>Configura tu Trinchera · laOra</title>
<link rel="canonical" href="https://laora.es/trinchera">
<link rel="icon" type="image/png" href="/assets/img/app-laora.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400&display=swap" rel="stylesheet">
<!-- GENERADO por herramientas/generar_configuradores.py — no editar a mano. -->
<link rel="stylesheet" href="/assets/css/configurador.css?v=21">
</head>
<body>

<header class="cfg-cab">
  <!-- El logotipo es el único camino de vuelta que tiene esta pantalla:
       sin él sería un callejón sin salida. No se le añade un menú porque
       aquí solo se hace una cosa, que es elegir el reloj. -->
  <a class="cfg-marca" href="/coleccion.html" aria-label="Volver a la colección de laOra"><img src="/assets/img/lunar-v2/laora-wordmark-dark.png" alt="laOra"><b>Trinchera</b></a>
  <span class="ref">Ref. <span data-ref>—</span></span>
  <!-- El rótulo del enlace va en dos piezas: en el teléfono no caben
       cuatro palabras al lado del logotipo sin montarse encima de la
       referencia, y recortar con puntos suspensivos deja un enlace que
       no se entiende. -->
  <button class="cfg-ficha-boton" type="button" data-abre-ficha><span class="largo">Ver la ficha completa</span><span class="corto">Ficha</span></button>
</header>

<div class="cfg-cuerpo">

  <!-- EL VISOR · lo único que cambia al elegir, y sin moverse de sitio -->
  <section class="cfg-visor" aria-label="El reloj que estás configurando">
    <img class="cfg-foto" data-foto
         src="/assets/img/catalogo/LO-05_Trinchera_A01.webp"
         alt="Reloj laOra Trinchera, acabado Alba, con nato verde militar"
         fetchpriority="high">
    <div class="cfg-muestra" aria-hidden="true">
      <span class="tira" data-muestra-tira style="background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 3px,rgba(0,0,0,.07) 3px 6px),linear-gradient(150deg,#5a6340 0%,#3f4630 55%,#2e331f 100%)"></span>
      <span data-muestra-nombre>NATO verde militar</span>
    </div>
    <!-- Los dos rótulos van JUNTOS y en flujo normal dentro de este
         bloque, no sueltos y colocados cada uno por su cuenta. Cuando
         eran hermanos absolutos, un acabado de nombre largo —«Eclipse
         Seiko NH35A · Brazalete incluido»— pasaba a dos líneas y la
         segunda caía encima de la referencia: dos textos superpuestos,
         ilegibles los dos. Así el segundo siempre baja. -->
    <div class="cfg-rotulos">
      <p class="cfg-viendo" data-viendo aria-live="polite"><b>Alba</b> · NATO verde militar</p>
      <!-- La referencia también aquí: en el teléfono no cabe en la
           cabecera, y es el dato con el que Óscar busca en la hoja. -->
      <p class="cfg-ref-visor">Ref. <span data-ref>—</span></p>
    </div>
  </section>

  <!-- LAS OPCIONES · todas a la vista, sin desplegar nada -->
  <section class="cfg-panel" aria-label="Opciones del Trinchera">

    <div class="cfg-grupo">
      <p class="cfg-rotulo">Acabado <b>6 opciones</b></p>
      <div class="cfg-acabados" role="group" aria-label="Elegir acabado">
        <button type="button" data-acabado="alba" aria-pressed="false"><b>Alba</b><small>desde 169,90 €</small></button>
        <button type="button" data-acabado="cenit" aria-pressed="false"><b>Cenit</b><i>ST2130</i><small>desde 209,90 €</small></button>
        <button type="button" data-acabado="cenit-nh38" aria-pressed="false"><b>Cenit</b><i>Seiko NH38A</i><small>desde 269,90 €</small></button>
        <button type="button" data-acabado="eclipse" aria-pressed="false"><b>Eclipse</b><i>Seiko/TMI VH31</i><small>desde 169,90 €</small></button>
        <button type="button" data-acabado="eclipse-suizo" aria-pressed="false"><b>Eclipse</b><i>ST2130</i><small>desde 209,90 €</small></button>
        <button type="button" data-acabado="eclipse-nh38" aria-pressed="false"><b>Eclipse</b><i>Seiko NH38A</i><small>desde 269,90 €</small></button>
      </div>
      <p class="cfg-nota" data-nota>El segundero de barrido del cuarzo, sin el tictac. Titanio en mate, que no da reflejos.</p>
    </div>

    <div class="cfg-grupo">
      <p class="cfg-rotulo">Brazalete o correa <b data-rotulo-correa><b>2 opciones</b></b></p>
      <!-- `--correas` es cuántas columnas caben de verdad. La rejilla
           era siempre de cuatro, así que con tres correas quedaba una
           columna vacía y los tres nombres partidos en dos líneas por
           falta de ancho. Ahora la rejilla tiene el ancho de lo que hay. -->
      <div class="cfg-correas" role="group" aria-label="Elegir brazalete o correa" style="--correas:2">
        <button type="button" data-correa="0" aria-pressed="false"><span class="tira" style="background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 3px,rgba(0,0,0,.07) 3px 6px),linear-gradient(150deg,#5a6340 0%,#3f4630 55%,#2e331f 100%)"></span><span>NATO verde militar</span></button>
        <button type="button" data-correa="1" aria-pressed="false"><span class="tira" style="background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 3px,rgba(0,0,0,.07) 3px 6px),linear-gradient(150deg,#2c2d2e 0%,#1a1b1c 55%,#0f1010 100%)"></span><span>NATO negra</span></button>
      </div>
    </div>

    <div class="cfg-nota">
      <dl data-ficha></dl>
    </div>

  </section>
</div>

<!-- LA BARRA · pegada abajo, con el precio de lo elegido -->
<footer class="cfg-barra">
  <span class="lado">
    <span class="eleccion" data-eleccion>Alba · NATO verde militar</span>
    <span class="ref">Ref. <span data-ref>—</span></span>
  </span>
  <span class="cfg-precio">
    <strong data-precio>169,90 €</strong>
    <span>Impuestos incluidos</span>
  </span>
  <button class="cfg-reservar" type="button" data-reservar>Reservar</button>
</footer>

<!-- LA FICHA TÉCNICA COMPLETA
     Se monta al pulsar y se tira al cerrar, como el overlay del
     material aprobado: mientras no está abierta, no existe en la
     página. No cambia la dirección ni mueve la pantalla de debajo.

     Los datos NO van escritos: los rellena `configurador.js` con la
     combinación que haya elegida en ese momento. Si fueran fijos, quien
     configurase el Cenit leería la ficha del acabado de partida. -->
<template data-plantilla-ficha>
  <div class="cfg-overlay" role="dialog" aria-modal="true" aria-labelledby="cfg-ficha-titulo">
    <div class="cfg-overlay-caja">
      <header class="cfg-overlay-cab">
        <div>
          <p>LO—05 · FICHA TÉCNICA COMPLETA</p>
          <h2 id="cfg-ficha-titulo">Todo el Trinchera.<br><em>Dato a dato.</em></h2>
        </div>
        <p class="cfg-overlay-ref"><span>Referencia</span><strong data-ref>—</strong></p>
        <button class="cfg-overlay-x" type="button" aria-label="Cerrar la ficha técnica" data-cierra-ficha>×</button>
      </header>
      <div class="cfg-overlay-grupos" data-grupos></div>
      <footer class="cfg-overlay-pie">
        <p data-overlay-resumen></p>
        <button class="cfg-ficha-boton" type="button" data-cierra-ficha>Cerrar ficha</button>
      </footer>
    </div>
  </div>
</template>
