<meta name="description" content="Configura tu Bitácora de laOra: acabado, brazalete o correa y precio, en una sola pantalla. Desde 219,90 €.">
<meta name="theme-color" content="#151715">
<title>Configura tu Bitácora · laOra</title>

<body>

<header class="cfg-cab">
  <!-- El logotipo es el único camino de vuelta que tiene esta pantalla:
       sin él sería un callejón sin salida. No se le añade un menú porque
       aquí solo se hace una cosa, que es elegir el reloj. -->
  <a class="cfg-marca" href="/coleccion.html" aria-label="Volver a la colección de laOra"><img src="/assets/img/lunar-v2/laora-wordmark-dark.png" alt="laOra"><b>Bitácora</b></a>
  <span class="ref">Ref. <span data-ref>—</span></span>
  <!-- El rótulo del enlace va en dos piezas: en el teléfono no caben
       cuatro palabras al lado del logotipo sin montarse encima de la
       referencia, y recortar con puntos suspensivos deja un enlace que
       no se entiende. -->
  <button class="cfg-ficha-boton" type="button" data-abre-ficha><span class="largo">Ver la ficha completa</span><span class="corto">Ficha</span></button>
</header>

<div class="cfg-cuerpo">

  <!-- EL VISOR · lo único que cambia al elegir, y sin moverse de sitio -->
  <section class="cfg-visor" aria-label="El reloj que estás configurando">
    <img class="cfg-foto" data-foto
         src="/assets/img/catalogo/LO-07_Bitacora_A01.webp"
         alt="Reloj laOra Bitácora, acabado Alba, con brazalete integrado de acero 316l"
         fetchpriority="high">
    <div class="cfg-muestra" aria-hidden="true">
      <span class="tira" data-muestra-tira style="background:linear-gradient(150deg,#eef0f1 0%,#b4b8bc 30%,#e6e8ea 52%,#93979c 76%,#cfd2d5 100%)"></span>
      <span data-muestra-nombre>Brazalete integrado de acero 316L</span>
    </div>
    <!-- Los dos rótulos van JUNTOS y en flujo normal dentro de este
         bloque, no sueltos y colocados cada uno por su cuenta. Cuando
         eran hermanos absolutos, un acabado de nombre largo —«Eclipse
         Seiko NH35A · Brazalete incluido»— pasaba a dos líneas y la
         segunda caía encima de la referencia: dos textos superpuestos,
         ilegibles los dos. Así el segundo siempre baja. -->
    <div class="cfg-rotulos">
      <p class="cfg-viendo" data-viendo aria-live="polite"><b>Alba</b> · Brazalete integrado de acero 316L</p>
      <!-- La referencia también aquí: en el teléfono no cabe en la
           cabecera, y es el dato con el que Óscar busca en la hoja. -->
      <p class="cfg-ref-visor">Ref. <span data-ref>—</span></p>
    </div>
  </section>

  <!-- LAS OPCIONES · todas a la vista, sin desplegar nada -->
  <section class="cfg-panel" aria-label="Opciones del Bitácora">

    <div class="cfg-grupo">
      <p class="cfg-rotulo">Acabado <b>6 opciones</b></p>
      <div class="cfg-acabados" role="group" aria-label="Elegir acabado">
        <button type="button" data-acabado="alba" aria-pressed="false"><b>Alba</b><small>desde 219,90 €</small></button>
        <button type="button" data-acabado="levante" aria-pressed="false"><b>Levante</b><small>desde 279,90 €</small></button>
        <button type="button" data-acabado="cenit" aria-pressed="false"><b>Cenit</b><small>desde 349,90 €</small></button>
        <button type="button" data-acabado="eclipse" aria-pressed="false"><b>Eclipse</b><i>Ronda 515-3 (suizo)</i><small>desde 219,90 €</small></button>
        <button type="button" data-acabado="eclipse-nh35a" aria-pressed="false"><b>Eclipse</b><i>Seiko/TMI NH35A</i><small>desde 309,90 €</small></button>
        <button type="button" data-acabado="eclipse-9015" aria-pressed="false"><b>Eclipse</b><i>Miyota 9015</i><small>desde 369,90 €</small></button>
      </div>
      <p class="cfg-nota" data-nota></p>
    </div>

    <div class="cfg-grupo">
      <p class="cfg-rotulo">Brazalete o correa <b data-rotulo-correa><b>4 opciones</b></b></p>
      <!-- `--correas` es cuántas columnas caben de verdad. La rejilla
           era siempre de cuatro, así que con tres correas quedaba una
           columna vacía y los tres nombres partidos en dos líneas por
           falta de ancho. Ahora la rejilla tiene el ancho de lo que hay. -->
      <div class="cfg-correas" role="group" aria-label="Elegir brazalete o correa" style="--correas:4">
        <button type="button" data-correa="0" aria-pressed="false"><span class="tira" style="background:linear-gradient(150deg,#eef0f1 0%,#b4b8bc 30%,#e6e8ea 52%,#93979c 76%,#cfd2d5 100%)"></span><span>Brazalete integrado de acero 316L</span></button>
        <button type="button" data-correa="1" aria-pressed="false"><span class="tira" style="background:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 4px,rgba(0,0,0,.05) 4px 8px),linear-gradient(150deg,#2b2c2d,#151616)"></span><span>Correa Goma negra · 40 mm (caja cuadrada), con PVD negro</span></button>
        <button type="button" data-correa="2" aria-pressed="false"><span class="tira" style="background:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 4px,rgba(0,0,0,.05) 4px 8px),linear-gradient(150deg,#2b2c2d,#151616)"></span><span>Correa Goma negra · 40 mm (caja cuadrada), con PVD oro rosa</span></button>
        <button type="button" data-correa="3" aria-pressed="false"><span class="tira" style="background:linear-gradient(150deg,#4a4c4e 0%,#232526 30%,#3d3f41 52%,#171819 78%,#303233 100%)"></span><span>Brazalete integrado de acero con PVD negro</span></button>
      </div>
    </div>

    <div class="cfg-nota">
      <dl data-ficha></dl>
    </div>

  </section>
</div>

<!-- LA BARRA · pegada abajo, con el precio de lo elegido -->
<footer class="cfg-barra">
  <span class="lado">
    <span class="eleccion" data-eleccion>Alba · Brazalete integrado de acero 316L</span>
    <span class="ref">Ref. <span data-ref>—</span></span>
  </span>
  <span class="cfg-precio">
    <strong data-precio>219,90 €</strong>
    <span>Impuestos incluidos</span>
  </span>
  <button class="cfg-reservar" type="button" data-reservar>Reservar</button>
</footer>

<!-- LA FICHA TÉCNICA COMPLETA
     Se monta al pulsar y se tira al cerrar, como el overlay del
     material aprobado: mientras no está abierta, no existe en la
     página. No cambia la dirección ni mueve la pantalla de debajo.

     Los datos NO van escritos: los rellena `configurador.js` con la
     combinación que haya elegida en ese momento. Si fueran fijos, quien
     configurase el Cenit leería la ficha del acabado de partida. -->
<template data-plantilla-ficha>
  <div class="cfg-overlay" role="dialog" aria-modal="true" aria-labelledby="cfg-ficha-titulo">
    <div class="cfg-overlay-caja">
      <header class="cfg-overlay-cab">
        <div>
          <p>LO—07 · FICHA TÉCNICA COMPLETA</p>
          <h2 id="cfg-ficha-titulo">Todo el Bitácora.<br><em>Dato a dato.</em></h2>
        </div>
        <p class="cfg-overlay-ref"><span>Referencia</span><strong data-ref>—</strong></p>
        <button class="cfg-overlay-x" type="button" aria-label="Cerrar la ficha técnica" data-cierra-ficha>×</button>
      </header>
      <div class="cfg-overlay-grupos" data-grupos></div>
      <footer class="cfg-overlay-pie">
        <p data-overlay-resumen></p>
        <button class="cfg-ficha-boton" type="button" data-cierra-ficha>Cerrar ficha</button>
      </footer>
    </div>
  </div>
</template>
