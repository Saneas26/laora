<body class="cfg-normal">

<header class="cfg-cab">
  <!-- El logotipo es el único camino de vuelta que tiene esta pantalla:
       sin él sería un callejón sin salida. No se le añade un menú porque
       aquí solo se hace una cosa, que es elegir el reloj. -->
  <a class="cfg-marca" href="/coleccion.html" aria-label="Volver a la colección de laOra"><img src="/assets/img/lunar-v2/laora-wordmark-dark.png" alt="laOra"><b>Cero Cero</b></a>
  <span class="ref">Ref. <span data-ref>—</span></span>
  <!-- El rótulo del enlace va en dos piezas: en el teléfono no caben
       cuatro palabras al lado del logotipo sin montarse encima de la
       referencia, y recortar con puntos suspensivos deja un enlace que
       no se entiende. -->
  <button class="cfg-ficha-boton" type="button" data-abre-ficha><span class="largo">Ver la ficha completa</span><span class="corto">Ficha</span></button>
</header>

<div class="cfg-cuerpo">

  <!-- EL VISOR · lo único que cambia al elegir, y sin moverse de sitio -->
  <section class="cfg-visor" aria-label="El reloj que estás configurando">
    <img class="cfg-foto" data-foto
         src="/assets/img/catalogo/LO-02_CeroCero_A01.webp"
         alt="Reloj laOra Cero Cero, acabado Alba, con brazalete malla milanesa acero"
         fetchpriority="high">
    <div class="cfg-muestra" aria-hidden="true">
      <span class="tira" data-muestra-tira style="background:repeating-linear-gradient(60deg,#e4e6e8 0 2px,#adb1b5 2px 4px),linear-gradient(150deg,#eceef0,#a2a6ab)"></span>
      <span data-muestra-nombre>Brazalete malla milanesa acero</span>
    </div>
    <!-- Los dos rótulos van JUNTOS y en flujo normal dentro de este
         bloque, no sueltos y colocados cada uno por su cuenta. Cuando
         eran hermanos absolutos, un acabado de nombre largo —«Eclipse
         Seiko NH35A · Brazalete incluido»— pasaba a dos líneas y la
         segunda caía encima de la referencia: dos textos superpuestos,
         ilegibles los dos. Así el segundo siempre baja. -->
    <div class="cfg-rotulos">
      <p class="cfg-viendo" data-viendo aria-live="polite"><b>Alba</b> · Brazalete malla milanesa acero</p>
      <!-- La referencia también aquí: en el teléfono no cabe en la
           cabecera, y es el dato con el que Óscar busca en la hoja. -->
      <p class="cfg-ref-visor">Ref. <span data-ref>—</span></p>
    </div>
  </section>

  <!-- LAS OPCIONES · todas a la vista, sin desplegar nada -->
  <section class="cfg-panel" aria-label="Opciones del Cero Cero">

    <div class="cfg-grupo">
      <p class="cfg-rotulo">Acabado <b>6 opciones</b></p>
      <div class="cfg-acabados" role="group" aria-label="Elegir acabado">
        <button type="button" data-acabado="alba" aria-pressed="false"><b>Alba</b><small>desde 209,90 €</small></button>
        <button type="button" data-acabado="levante" aria-pressed="false"><b>Levante</b><small>desde 279,90 €</small></button>
        <button type="button" data-acabado="cenit" aria-pressed="false"><b>Cenit</b><small>desde 359,90 €</small></button>
        <button type="button" data-acabado="eclipse" aria-pressed="false"><b>Eclipse</b><i>TMI VH31B</i><small>desde 209,90 €</small></button>
        <button type="button" data-acabado="eclipse-nh35a" aria-pressed="false"><b>Eclipse</b><i>Seiko/TMI NH35A</i><small>desde 269,90 €</small></button>
        <button type="button" data-acabado="eclipse-9015" aria-pressed="false"><b>Eclipse</b><i>Miyota 9015</i><small>desde 329,90 €</small></button>
      </div>
      <p class="cfg-nota" data-nota></p>
    </div>

    <div class="cfg-grupo">
      <p class="cfg-rotulo">Brazalete o correa <b data-rotulo-correa><b>4 opciones</b></b></p>
      <!-- `--correas` es cuántas columnas caben de verdad. La rejilla
           era siempre de cuatro, así que con tres correas quedaba una
           columna vacía y los tres nombres partidos en dos líneas por
           falta de ancho. Ahora la rejilla tiene el ancho de lo que hay. -->
      <div class="cfg-correas" role="group" aria-label="Elegir brazalete o correa" style="--correas:4">
        <button type="button" data-correa="0" aria-pressed="false"><span class="tira" style="background:repeating-linear-gradient(60deg,#e4e6e8 0 2px,#adb1b5 2px 4px),linear-gradient(150deg,#eceef0,#a2a6ab)"></span><span>Brazalete malla milanesa acero</span></button>
        <button type="button" data-correa="1" aria-pressed="false"><span class="tira" style="background:repeating-linear-gradient(60deg,#e4e6e8 0 2px,#adb1b5 2px 4px),linear-gradient(150deg,#eceef0,#a2a6ab)"></span><span>Brazalete acero 316L malla cepillada</span></button>
        <button type="button" data-correa="2" aria-pressed="false"><span class="tira" style="background:linear-gradient(150deg,#f2f3f4 0%,#b9bcc0 26%,#eef0f2 46%,#8f9398 70%,#d6d9dc 100%)"></span><span>Brazalete acero 904L</span></button>
        <button type="button" data-correa="3" aria-pressed="false"><span class="tira" style="background:repeating-linear-gradient(60deg,#e4e6e8 0 2px,#adb1b5 2px 4px),linear-gradient(150deg,#eceef0,#a2a6ab)"></span><span>Brazalete malla milanesa PVD negro</span></button>
      </div>
    </div>

    <div class="cfg-nota">
      <dl data-ficha></dl>
    </div>

  </section>
</div>

<!-- LA BARRA · pegada abajo, con el precio de lo elegido -->
<footer class="cfg-barra">
  <span class="lado">
    <span class="eleccion" data-eleccion>Alba · Brazalete malla milanesa acero</span>
    <span class="ref">Ref. <span data-ref>—</span></span>
  </span>
  <span class="cfg-precio">
    <strong data-precio>209,90 €</strong>
    <span>Impuestos incluidos</span>
  </span>
  <button class="cfg-reservar" type="button" data-reservar>Reservar</button>
</footer>

<!-- LA FICHA TÉCNICA COMPLETA
     Se monta al pulsar y se tira al cerrar, como el overlay del
     material aprobado: mientras no está abierta, no existe en la

     Los datos NO van escritos: los rellena `configurador.js` con la
     combinación que haya elegida en ese momento. Si fueran fijos, quien
     configurase el Cenit leería la ficha del acabado de partida. -->

    <div class="cfg-overlay-caja">
      <header class="cfg-overlay-cab">

        <p class="cfg-overlay-ref"><span>Referencia</span><strong data-ref>—</strong></p>
        <button class="cfg-overlay-x" type="button" aria-label="Cerrar la ficha técnica" data-cierra-ficha>×</button>
      </header>
      <div class="cfg-overlay-grupos" data-grupos></div>
      <footer class="cfg-overlay-pie">
        <p data-overlay-resumen></p>
        <button class="cfg-ficha-boton" type="button" data-cierra-ficha>Cerrar ficha</button>
      </footer>
    </div>
  </div>
</template>
