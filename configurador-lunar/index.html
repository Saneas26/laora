<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configurador Lunar · laOra</title>
<style>
  :root{ --tinta:#141414; --papel:#F7F7F5; --linea:#D8D6D2; --suave:#6B6B6B; }
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--papel); color:var(--tinta);
        font:16px/1.6 ui-sans-serif,system-ui,"Avenir Next","Segoe UI",sans-serif }
  header{ padding:28px 20px 6px; text-align:center }
  header h1{ margin:0; font:400 34px/1.15 Georgia,"Cormorant Garamond",serif;
             letter-spacing:.1em; text-transform:uppercase }
  header p{ margin:8px 0 0; color:var(--suave); font-size:13px }
  .envoltorio{ max-width:1180px; margin:0 auto; padding:14px 20px 60px;
               display:grid; gap:34px; grid-template-columns:1fr }
  @media (min-width:900px){ .envoltorio{ grid-template-columns:1.05fr .95fr; align-items:start } }

  /* Render: contenedor cuadrado, fondo + correa + cabeza (INSTRUCCIONES) */
  .lunar-preview {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    overflow: hidden;
    background: #EAE8E8;
  }
  .lunar-preview > img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }

  .grupo{ margin-bottom:26px }
  .grupo h2{ margin:0 0 10px; font-size:11px; letter-spacing:.2em;
             text-transform:uppercase; color:var(--suave); font-weight:700 }
  .opciones{ display:flex; flex-wrap:wrap; gap:10px }
  button.op{ appearance:none; background:#fff; border:1px solid var(--linea);
             border-radius:10px; padding:11px 15px; font-size:14px; cursor:pointer;
             color:var(--tinta); transition:border-color .15s, box-shadow .15s }
  button.op:hover{ border-color:#B9B6B1 }
  button.op[aria-pressed="true"]{ border-color:var(--tinta); box-shadow:inset 0 0 0 1px var(--tinta) }
  .ficha{ border-top:1px solid var(--linea); margin-top:24px; padding-top:16px }
  .ficha strong{ display:block; font:400 24px/1.25 Georgia,"Cormorant Garamond",serif }
  .ficha code{ display:block; margin-top:6px; color:var(--suave); font-size:12px;
               word-break:break-all }
  .aviso{ margin-top:20px; padding:12px 14px; background:#fff; border:1px solid var(--linea);
          border-radius:10px; color:var(--suave); font-size:13px }
</style>
</head>
<body>
<header>
  <h1 id="titulo">laOra · Lunar</h1>
  <p id="subtitulo">Cargando el manifiesto…</p>
</header>

<div class="envoltorio">
  <div class="lunar-preview" id="escena">
    <img id="capa-strap" alt="Correa">
    <img id="capa-head" alt="Cabeza del reloj">
  </div>

  <div>
    <div class="grupo">
      <h2>Cabeza</h2>
      <div class="opciones" id="cabezas"></div>
    </div>
    <div class="grupo">
      <h2>Correa</h2>
      <div class="opciones" id="correas"></div>
    </div>
    <div class="ficha">
      <strong id="seleccion">—</strong>
      <code id="rutas"></code>
    </div>
    <div class="aviso" id="aviso"></div>
  </div>
</div>

<script>
const MANIFIESTO = 'manifest.json';
let M = null;
const sel = { head: null, strap: null };

function bonito(id){                       // solo para la etiqueta del botón
  return id.replace(/^cab-/, '').replace(/-/g, ' ');
}

function pinta(){
  document.getElementById('capa-strap').src = M.straps[sel.strap];
  document.getElementById('capa-head').src  = M.heads[sel.head];
  document.getElementById('seleccion').textContent = bonito(sel.head);
  document.getElementById('rutas').textContent =
    M.straps[sel.strap] + '  +  ' + M.heads[sel.head];
  for (const [id, mapa, campo] of [['cabezas', M.heads, 'head'],
                                   ['correas', M.straps, 'strap']]) {
    const cont = document.getElementById(id);
    cont.innerHTML = '';
    for (const clave of Object.keys(mapa)) {
      const b = document.createElement('button');
      b.className = 'op';
      b.type = 'button';
      b.textContent = bonito(clave);
      b.setAttribute('aria-pressed', String(sel[campo] === clave));
      b.onclick = () => { sel[campo] = clave; pinta(); };
      cont.appendChild(b);
    }
  }
}

fetch(MANIFIESTO)
  .then(r => r.json())
  .then(m => {
    M = m;
    sel.head  = m.default.head;
    sel.strap = m.default.strap;
    document.getElementById('titulo').textContent = m.product;
    document.getElementById('subtitulo').textContent =
      `${Object.keys(m.heads).length} cabezas · ${Object.keys(m.straps).length} correa · lienzo ${m.canvas.width}×${m.canvas.height}`;
    document.getElementById('escena').style.background = m.canvas.background;
    document.getElementById('aviso').textContent =
      'Capas en el orden del manifiesto: ' + m.layerOrder.join(' → ') +
      '. Los activos se muestran tal cual: mismo lienzo, misma escala, mismo encuadre.';
    pinta();
  })
  .catch(e => {
    document.getElementById('subtitulo').textContent =
      'No se pudo leer manifest.json: ' + e;
  });
</script>
</body>
</html>
